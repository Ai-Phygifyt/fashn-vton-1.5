data:
  dataset_root: dataset
  train_csv: dataset/train.csv
  val_csv: dataset/val.csv
  cache_dir: data_cache
  height: 648
  width: 432
  category: one-pieces
  use_agnostic_mask: true
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true
  hflip_prob: 0.0
  max_train_samples: null
  max_val_samples: null
cleaning:
  max_person_fraction: 0.002
  reject_blouse_renders: true
  blouse_top_lo: 0.1
  blouse_top_hi: 0.35
  require_hi_res: true
  drop_duplicates: true
  min_garment_score: 0.0
  enable_sketch_filter: false
  max_flat_fraction: 0.9
  min_colorfulness: 8.0
  enable_collage_filter: false
  max_foreground_components: 3
  min_component_area_frac: 0.02
  val_fraction: 0.05
  seed: 1337
lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  preset: attention_mlp
  target_modules: []
  include_blocks:
  - double_blocks
  - single_blocks
  - x_patch_mixer
  init_scale: 0.01
optim:
  optimizer: adamw8bit
  lr: 0.0001
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  max_grad_norm: 1.0
  scheduler: cosine
  warmup_steps: 100
  min_lr_ratio: 0.05
train:
  epochs: 10
  max_steps: null
  batch_size: 1
  grad_accum_steps: 8
  timestep_sampling: shifted
  time_shift_mu: 1.5
  logit_normal_mean: 0.0
  logit_normal_std: 1.0
  cond_dropout_prob: 0.1
  loss: mse
  huber_delta: 1.0
  loss_weighting: uniform
  seed: 42
memory:
  precision: bf16
  gradient_checkpointing: true
  empty_cache_every: 50
  gc_every: 200
  oom_retry: true
  oom_max_retries: 2
  set_alloc_conf: true
  aux_device: cpu
checkpoint:
  dir: checkpoints
  save_every_steps: 500
  save_every_epochs: 1
  keep_last: 3
  save_best: true
  monitor: val_loss
  monitor_mode: min
  resume: auto
log:
  dir: logs
  run_name: null
  log_every_steps: 10
  val_every_steps: 0
  tensorboard: true
  log_system_metrics: true
  sample_every_steps: 0
eval:
  metrics:
  - ssim
  - psnr
  - lpips
  num_timesteps: 30
  guidance_scale: 1.5
  seed: 42
  max_samples: null
weights_dir: weights
