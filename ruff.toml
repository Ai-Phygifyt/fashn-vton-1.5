line-length = 110
target-version = "py310"

# models/dwpose is vendored from IDEA-Research/DWPose and kept faithful to upstream,
# so it is excluded from style enforcement.
extend-exclude = ["models/dwpose"]

[lint]
select = ["E", "F", "I", "W"]   # errors, undefined/unused names, import order, warnings
ignore = ["E501"]               # line length is handled by the formatter
